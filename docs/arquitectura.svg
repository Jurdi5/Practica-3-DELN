<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .svc { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .pod { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .cfg { fill: #f8fafc; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .db  { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
      .cli { fill: #f1f5f9; stroke: #334155; stroke-width: 1.5; }
      .t   { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .s   { font-size: 12px; fill: #475569; }
      .e   { font-size: 12px; fill: #1e293b; }
      .g   { font-size: 13px; font-weight: 700; }
      .l   { stroke: #334155; stroke-width: 1.6; fill: none; }
      .ld  { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- servicios administrados -->
  <text x="300" y="22" class="g" fill="#ea580c">Servicios administrados de AWS (us-east-1)</text>
  <rect x="300" y="32" width="240" height="78" rx="10" class="svc"/>
  <text x="420" y="62" text-anchor="middle" class="t">SQS FIFO</text>
  <text x="420" y="82" text-anchor="middle" class="s">concertpass-reservations.fifo</text>
  <text x="420" y="98" text-anchor="middle" class="s">MessageGroupId = concert_id</text>

  <rect x="600" y="32" width="200" height="78" rx="10" class="svc"/>
  <text x="700" y="62" text-anchor="middle" class="t">DynamoDB</text>
  <text x="700" y="82" text-anchor="middle" class="s">tabla concerts</text>
  <text x="700" y="98" text-anchor="middle" class="s">capacidad por seccion</text>

  <rect x="840" y="32" width="170" height="78" rx="10" class="svc"/>
  <text x="925" y="62" text-anchor="middle" class="t">Secrets Manager</text>
  <text x="925" y="82" text-anchor="middle" class="s">concertpass/rds</text>
  <text x="925" y="98" text-anchor="middle" class="s">credenciales de RDS</text>

  <rect x="1040" y="32" width="140" height="78" rx="10" class="svc"/>
  <text x="1110" y="62" text-anchor="middle" class="t">ECR</text>
  <text x="1110" y="82" text-anchor="middle" class="s">3 repositorios</text>
  <text x="1110" y="98" text-anchor="middle" class="s">imagenes :latest</text>

  <!-- VPC -->
  <rect x="230" y="160" width="950" height="585" rx="14" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="248" y="184" class="g" fill="#64748b">VPC creada por eksctl</text>

  <!-- cluster -->
  <rect x="260" y="200" width="890" height="320" rx="12" fill="#f8fbff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="750" y="228" class="g" fill="#2563eb">Cluster EKS concertpass</text>
  <text x="750" y="246" class="s">2 nodos t3.medium · nodos con LabRole</text>

  <rect x="300" y="290" width="220" height="90" rx="10" class="pod"/>
  <text x="410" y="320" text-anchor="middle" class="t">ticket-api</text>
  <text x="410" y="340" text-anchor="middle" class="s">Deployment · FastAPI</text>
  <text x="410" y="358" text-anchor="middle" class="s">Service NodePort :30080</text>

  <rect x="600" y="290" width="220" height="90" rx="10" class="pod"/>
  <text x="710" y="320" text-anchor="middle" class="t">ticket-worker</text>
  <text x="710" y="340" text-anchor="middle" class="s">Deployment · 1 replica</text>
  <text x="710" y="358" text-anchor="middle" class="s">(prueba con 3)</text>

  <rect x="870" y="420" width="250" height="80" rx="10" class="pod"/>
  <text x="995" y="450" text-anchor="middle" class="t">ticket-checkout</text>
  <text x="995" y="470" text-anchor="middle" class="s">Deployment · ClusterIP :8000</text>
  <text x="995" y="486" text-anchor="middle" class="s">pago simulado, responde 200</text>

  <rect x="870" y="290" width="250" height="90" rx="10" class="cfg"/>
  <text x="995" y="318" text-anchor="middle" class="t">Secret rds-credentials</text>
  <text x="995" y="338" text-anchor="middle" class="t">ConfigMap app-config</text>
  <text x="995" y="360" text-anchor="middle" class="s">variables de entorno de los pods</text>

  <!-- subredes privadas -->
  <rect x="260" y="555" width="890" height="170" rx="12" fill="#f6fdf9" stroke="#059669" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="278" y="688" class="g" fill="#059669">Subredes privadas</text>
  <text x="278" y="706" class="s">SG: 5432 solo desde el cluster</text>
  <rect x="560" y="610" width="280" height="90" rx="10" class="db"/>
  <text x="700" y="642" text-anchor="middle" class="t">RDS PostgreSQL</text>
  <text x="700" y="662" text-anchor="middle" class="s">db.t3.micro · tabla reservations</text>
  <text x="700" y="680" text-anchor="middle" class="s">pending → booked → confirmed / rejected</text>

  <!-- cliente -->
  <rect x="10" y="290" width="150" height="90" rx="10" class="cli"/>
  <text x="85" y="322" text-anchor="middle" class="t">Cliente</text>
  <text x="85" y="342" text-anchor="middle" class="s">curl / scripts</text>
  <text x="85" y="358" text-anchor="middle" class="s">de prueba</text>

  <!-- flechas -->
  <path d="M160 335 H296" class="l"/>
  <text x="228" y="310" text-anchor="middle" class="e">POST /reserve</text>
  <text x="228" y="326" text-anchor="middle" class="e">GET /reservation/{id}</text>

  <path d="M410 290 V114" class="l"/>
  <text x="418" y="150" class="e">1. SendMessage</text>

  <path d="M380 380 L612 607" class="l"/>
  <text x="452" y="472" text-anchor="end" class="e">INSERT pending</text>
  <text x="466" y="488" text-anchor="end" class="e">SELECT status</text>

  <path d="M500 110 L650 287" class="l"/>
  <text x="590" y="182" class="e">2. polling</text>

  <path d="M730 290 V114" class="l"/>
  <text x="738" y="150" class="e">3. capacidad</text>

  <path d="M720 380 V606" class="l"/>
  <text x="712" y="450" text-anchor="end" class="e">4. BEGIN · SUM ... FOR UPDATE</text>
  <text x="712" y="466" text-anchor="end" class="e">UPDATE booked / rejected</text>
  <text x="712" y="482" text-anchor="end" class="e">6. UPDATE confirmed</text>

  <path d="M820 365 L866 440" class="l"/>
  <text x="852" y="409" class="e">5. POST /checkout</text>

  <path d="M995 110 V286" class="ld"/>
  <text x="1003" y="200" class="s">setup.sh</text>
  <path d="M866 335 H824" class="ld"/>

  <path d="M1110 110 V196" class="ld"/>
  <text x="1118" y="160" class="s">pull</text>
  <path d="M296.0 335.0 L285.0 330.0 L285.0 340.0 z" fill="#334155"/>
  <path d="M410.0 114.0 L405.0 125.0 L415.0 125.0 z" fill="#334155"/>
  <path d="M612.0 607.0 L607.6 595.7 L600.6 602.9 z" fill="#334155"/>
  <path d="M650.0 287.0 L646.7 275.4 L639.1 281.8 z" fill="#334155"/>
  <path d="M730.0 114.0 L725.0 125.0 L735.0 125.0 z" fill="#334155"/>
  <path d="M720.0 606.0 L725.0 595.0 L715.0 595.0 z" fill="#334155"/>
  <path d="M866.0 440.0 L864.5 428.0 L856.0 433.2 z" fill="#334155"/>
  <path d="M995.0 286.0 L1000.0 275.0 L990.0 275.0 z" fill="#94a3b8"/>
  <path d="M824.0 335.0 L835.0 340.0 L835.0 330.0 z" fill="#94a3b8"/>
  <path d="M1110.0 196.0 L1115.0 185.0 L1105.0 185.0 z" fill="#94a3b8"/>
</svg>
