apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-checkout
  template:
    metadata:
      labels:
        app: ticket-checkout
    spec:
      containers:
      - name: ticket-checkout
        image: <TU_ECR_URI_AQUI>/ticket-checkout:latest
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-checkout-service
spec:
  type: ClusterIP
  selector:
    app: ticket-checkout
  ports:
    - port: 8000
      targetPort: 8000
